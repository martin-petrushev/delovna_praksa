services:
  web:
    image: nginx:1.28-alpine
    ports:
      - "8080:80"
    configs:
      - source: website
        target: /usr/share/nginx/html/index.html
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-Y", "off", "-q", "-O", "/dev/null", "http://127.0.0.1/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

configs:
  website:
    file: ./index.html
